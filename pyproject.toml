[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commanders"
version = "0.1.0"
description = "Washington Commanders front-office analytics: nflverse -> Postgres -> FastAPI -> Angular, MLflow-tracked models"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "mlflow-skinny>=3.0,<4",
  "pandas>=2.2,<4",
  "pyarrow>=16",
  "cachetools>=5.3,<7",
  "slowapi>=0.1.9,<1",
  "orjson>=3.10",
]

[project.optional-dependencies]
pipeline = ["nflreadpy>=0.1.5,<1", "polars>=1.0,<2"]
models = ["scikit-learn>=1.5,<2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pip-audit>=2.7", "bandit>=1.7", "httpx>=0.27"]

# Registers the Cloudflare Access header provider with MLflow whenever this package is installed.
[project.entry-points."mlflow.request_header_provider"]
cloudflare_access = "api.mlflow_auth:CloudflareAccessHeaderProvider"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "ingest*", "models*", "db*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["api", "ingest", "models", "db"]
