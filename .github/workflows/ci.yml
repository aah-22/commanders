name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Sonar and the Coolify webhook only run once their secrets exist, so a fresh fork/clone stays green.
env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}

jobs:
  quality-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install ".[pipeline,models,dev]"
      - run: ruff check . && ruff format --check .
      - run: bandit -q -r api ingest models db
      - run: pip-audit
      - run: pytest -q --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: py-coverage, path: coverage.xml }

  quality-web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx ng lint
      - run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage --no-progress
      - run: npx ng build --configuration production
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: web-coverage, path: web/coverage }

  config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Dockerfiles, compose and nginx config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          exit-code: "1"
          severity: CRITICAL,HIGH

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  sonar:
    runs-on: ubuntu-latest
    needs: [quality-python, quality-web]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: py-coverage }
      - uses: actions/download-artifact@v4
        with: { name: web-coverage, path: web/coverage }
      - uses: SonarSource/sonarqube-scan-action@v5
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build → push → Trivy → SBOM for both images, main only. Coolify still builds from source; these are the scanned artifacts.
  images:
    runs-on: ubuntu-latest
    needs: [quality-python, quality-web, config-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: commanders-api, context: "." }
          - { name: commanders-web, context: "./web" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
      - name: Scan image (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          scan-type: image
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: "sbom-${{ matrix.name }}", path: "sbom-${{ matrix.name }}.cdx.json" }

  deploy:
    runs-on: ubuntu-latest
    needs: [images, sonar]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify deployment
        if: env.COOLIFY_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST "$COOLIFY_WEBHOOK_URL" -H "Content-Type: application/json"
